- title: "Truthful Two-Facility Location with Heterogeneous Preferences"
  speaker: "Dr. Panagiotis Kanellopoulos"
  date: "2026-10-26"
  time: "12:00-13:00"
  room: "Bush House (S) 5.01"
  abstract: "Suppose we need to locate two public facilities, such as a library and a health centre, and people have different preferences over which facilities they use. How should we choose their locations when people may strategically misreport where they live or which facilities they prefer? In this talk, I will explore this question through the lens of mechanism design, focusing on the trade-off between strategyproofness and efficiency. I will present strategyproof mechanisms and their approximation guarantees for locating two heterogeneous facilities among a set of candidate locations on a line, and discuss extensions to general networks."
  person_url: "https://www.essex.ac.uk/people/KANEL33803/Panagiotis-Kanellopoulos"
  paper_url: "https://arxiv.org/abs/2607.21046"

- title: "Beyond External Regret: the Unreasonable Effectiveness of Gradient Ascent"
  speaker: "Dr. Mete Ahunbay"
  date: "2026-11-09"
  time: "12:00-13:00"
  room: "Bush House (N) 5.11"
  abstract: "Projected gradient ascent is a simple algorithm for non-convex optimisation and for online learning. In the former case, under mild regularity assumptions the iterates converge to a local optimum. In the latter case, the typical guarantee associated with it is that of no-external regret; no fixed action outperforms the learner's expected utility over the learning trajectory in hindsight. Neither property explains the success of the algorithm in game settings, for our purposes, equilibrium convergence for the resulting dynamics in simple auctions. We call this the \"missing inequalities\" problem - surely, the learning trajectories satisfy constraints stronger than merely no-external regret. Recent work establishes this is precisely the case, and we in fact obtain a full characterisation of these enhanced regret guarantees. Strikingly, in normal-form games, the linear fragment of these guarantees lie strictly between correlated and coarse correlated equilibria, leading to the notion of a \"semicoarse equilibrium\".I shall aim to provide an intuitive account of the above from the perspective of adversarial regret analysis, as well as insights towards refined analysis of learning dynamics. The talk will incorporate elements of own work, one joint with Martin Bichler, and another joint with Weiqiang Zheng & Tao Lin."
  person_url: "https://mahunbay.info/"
