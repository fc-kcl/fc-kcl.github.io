# ---------------------------------------------------------------------------
# Everyone who appears on the site, in five groups. People are shown in the
# order they are listed here.
#
#   organisers          -> "Organisers" section on the home page
#   core_members        -> "Core Members" section on the home page
#   students            -> "Students" section on the home page
#   affiliate_members   -> "Affiliate Members" section on the home page
#   seminar_organisers  -> seminar organisers, on the home and seminar pages
#
# A group with no entries is hidden on the home page.
#
# Fields:
#   name         required
#   email        required
#   role         organisers and seminar_organisers only (e.g. "Group Head")
#   job_title    optional (core members, students and affiliate members)
#   website      optional; a personal homepage or KCL profile page, whichever
#                you would rather link to
#
# Section headings and intro text are configured in _data/site.yml.
# ---------------------------------------------------------------------------

